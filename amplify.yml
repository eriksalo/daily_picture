version: 1
applications:
  - appRoot: sites/daily
    frontend:
      phases:
        preBuild:
          commands:
            - npm --prefix frontend install
        build:
          commands:
            - npm --prefix frontend run build
      artifacts:
        baseDirectory: frontend/dist
        files:
          - '**/*'
      cache:
        paths:
          - frontend/node_modules/**/*
      customHeaders:
        - pattern: '*.appcache'
          headers:
            - key: Content-Type
              value: text/cache-manifest
            - key: Cache-Control
              value: no-cache
